<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sellapage™ is the ultimate one-link storefront solution for Nigerian business owners. Create a clean, mobile-optimized store in 5 minutes, list products, and receive structured customer orders instantly via WhatsApp." />
    <meta property="og:title" content="Sellapage™ — Take Your Business Online | Start Selling Instantly" />
    <meta property="og:description" content="Create your free professional business link in minutes. Let customers browse and order directly from your store to your WhatsApp. Built for modern African vendors." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sellapage.com.ng" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sellapage™ — Take Your Business Online | Start Selling Instantly" />
    <meta name="twitter:description" content="Create your free professional business link in minutes. Let customers browse and order directly from your store to your WhatsApp. Built for modern African vendors." />
    <title>Sellapage™ — Take Your Business Online | Start Selling Instantly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sellapage™",
      "alternateName": "Sellapage Digital Solutions",
      "url": "https://sellapage.com.ng",
      "description": "SaaS application enabling vendors and digital merchants to instantly launch mobile storefronts that structure checkouts directly into WhatsApp chats.",
      "applicationCategory": "BusinessApplication, eCommerce",
      "operatingSystem": "All",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "NGN",
        "lowPrice": "0",
        "highPrice": "12000",
        "offerCount": "3",
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter Plan",
            "price": "0",
            "priceCurrency": "NGN",
            "description": "Permanently free tier including 10 product listings, unique shareable store links, and live WhatsApp message order routing."
          },
          {
            "@type": "Offer",
            "name": "Growth Plan",
            "price": "5000",
            "priceCurrency": "NGN",
            "description": "Premium mid-market tier adding up to 50 listings, custom visual palette configuration, AI product descriptions, stock management logic, and multi-item WhatsApp Cart checkouts."
          },
          {
            "@type": "Offer",
            "name": "Pro Plan",
            "price": "12000",
            "priceCurrency": "NGN",
            "description": "Enterprise software package with unlimited listings, 20 custom store themes, an advanced analytics dashboard, and priority customer relation interfaces."
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
