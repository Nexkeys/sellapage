
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sellapage™ is an e-commerce workspace for Nigerian businesses to publish offers, manage customer enquiries, receive structured orders and grow from one live business link." />
    <meta property="og:title" content="Sellapage™ — e-Commerce Workspace for Nigerian Businesses" />
    <meta property="og:description" content="Create a professional business link for products, services, orders, enquiries, policies and customer growth. Built for modern African vendors." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sellapage.com.ng" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sellapage™ — e-Commerce Workspace for Nigerian Businesses" />
    <meta name="twitter:description" content="Create a professional business link for products, services, orders, enquiries, policies and customer growth. Built for modern African vendors." />
    <title>Sellapage™ — e-Commerce Workspace for Nigerian Businesses</title>
    <!-- PWA iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sellapage" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sellapage™",
      "alternateName": "Sellapage Digital Solutions",
      "url": "https://sellapage.com.ng",
      "description": "SaaS application enabling Nigerian vendors and service providers to publish offers, manage customer enquiries and receive structured orders from one live commerce workspace.",
      "applicationCategory": "BusinessApplication, eCommerce",
      "operatingSystem": "All",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "NGN",
        "lowPrice": "0",
        "highPrice": "25000",
        "offerCount": "4",
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter Plan",
            "price": "0",
            "priceCurrency": "NGN",
            "description": "Permanently free tier including 15 listings, a unique shareable business link, lead capture, offer tools and live WhatsApp order routing."
          },
          {
            "@type": "Offer",
            "name": "Growth Plan",
            "price": "5000",
            "priceCurrency": "NGN",
            "description": "Premium mid-market tier adding up to 50 listings, custom visual palette configuration, AI product descriptions, stock management logic, and multi-item WhatsApp Cart checkouts."
          },
          {
            "@type": "Offer",
            "name": "Pro Plan",
            "price": "12000",
            "priceCurrency": "NGN",
            "description": "Professional package with unlimited listings, 20 custom commerce themes, an advanced analytics dashboard, customer relationship tools, and priority support."
          },
          {
            "@type": "Offer",
            "name": "Premium Plan",
            "price": "25000",
            "priceCurrency": "NGN",
            "description": "Premium package for established businesses that need white-label commerce, WhatsApp Business automation, customer broadcasts, staff access controls, and advanced integrations."
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
