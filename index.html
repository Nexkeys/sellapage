    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["SoftwareApplication", "SaaS", "WebApplication"],
      "name": "Sellapage",
      "alternateName": "Sellapage Digital Solutions",
      "url": "https://sellapage.com.ng",
      "description": "All-in-one commerce platform for Nigerian businesses. Run products, services, checkout, delivery, customers, analytics, and growth from one dashboard. Free Starter plan.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "NGN",
        "lowPrice": "0",
        "highPrice": "25000",
        "offerCount": "4",
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter Plan",
            "price": "0",
            "priceCurrency": "NGN",
            "description": "Free forever. 15 total listings, 3 images per listing, WhatsApp order button, lead capture form, basic store page, Offer & Name Lab tool, Policy Generator tool."
          },
          {
            "@type": "Offer",
            "name": "Growth Plan",
            "price": "5000",
            "priceCurrency": "NGN",
            "description": "₦5,000/month. 50 total listings, 10 images per listing, analytics & click tracking, WhatsApp cart & multi-item orders, AI descriptions (20/day), product/service visibility toggle, manual orders tab, delivery pickup address, marketing tab, stock management, categories."
          },
          {
            "@type": "Offer",
            "name": "Pro Plan",
            "price": "12000",
            "priceCurrency": "NGN",
            "description": "₦12,000/month. Unlimited listings, 50 images per listing, 20 premium store themes, in-app Paystack checkout, automatic order creation, payouts with bank settlement, customer CRM, verified reviews, discounts & promo codes, Sendbox delivery integration, delivery zones, top-performing analytics, AI descriptions (50/day), product export (PDF/CSV/Excel), custom domain, CAC verification, priority support."
          },
          {
            "@type": "Offer",
            "name": "Premium Plan",
            "price": "25000",
            "priceCurrency": "NGN",
            "description": "₦25,000/month. Everything in Pro plus white-label customer experience, brand-only presentation, highest tier experience, premium positioning. The flagship plan for established operators."
          }
        ]
      },
      "featureList": [
        "Public store page for products",
        "Public services page for bookings",
        "20 premium store themes",
        "Full colour, font, and layout customization",
        "Product grid with zoom lightbox and stock badges",
        "Service cards with duration, location, booking modal",
        "Category filters and search",
        "WhatsApp cart for Growth users",
        "In-app Paystack checkout for Pro and Premium",
        "Lead capture form",
        "Sendbox rate display at checkout",
        "PDF receipt download",
        "Star ratings on products and services",
        "Custom store footer",
        "Dashboard: products, services, categories, orders, delivery, CRM, analytics, discounts, reviews, billing, settings, support",
        "Push notifications via FCM",
        "Email notifications via Resend"
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5.0",
        "reviewCount": "100",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do my customers need to download anything?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your store is a regular web page customers just tap your link. No app, no account, no friction at all."
          }
        },
        {
          "@type": "Question",
          "name": "How does the order work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Customers browse your store, choose a product or service, and send a structured order with the important details already included. You confirm from your workflow."
          }
        },
        {
          "@type": "Question",
          "name": "Can I update my products after I create the store?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your dashboard lets you add, edit, or remove products anytime. Changes go live on your store instantly."
          }
        },
        {
          "@type": "Question",
          "name": "What if I'm not good with technology?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sellapage is built for everyday business owners, not technical teams. If you can upload photos and fill a simple form, you can run your store here."
          }
        },
        {
          "@type": "Question",
          "name": "How do I share my page with customers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You get a link like sellapage.com.ng/yourbrandname. Paste it in your social bio, WhatsApp status, campaign posts, or send it directly to anyone."
          }
        },
        {
          "@type": "Question",
          "name": "Is it really free to start?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — the Starter plan is permanently free. Paid plans are Growth at ₦5,000/month, Pro at ₦12,000/month, and Premium at ₦25,000/month with more features as you grow."
          }
        }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://sellapage.com.ng/"
        }
      ]
    }
    </script>
  </head>
