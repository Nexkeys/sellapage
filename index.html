    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["SoftwareApplication", "WebApplication"],
      "name": "Sellapage",
      "alternateName": "Sellapage Technologies",
      "url": "https://www.sellapage.com.ng",
      "description": "Sellapage is the business management and growth platform for Nigerian businesses. Sell online, take payments, run orders and bookings, book delivery, keep customer records and receipts, and get found on Google, from one dashboard and the Android app. Free to start.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "NGN",
        "lowPrice": "0",
        "highPrice": "25000",
        "offerCount": "4",
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter Plan",
            "price": "0",
            "priceCurrency": "NGN",
            "description": "Free forever. 15 total listings, 3 images per listing, WhatsApp order button, lead capture form, basic store page, Offer & Name Lab tool, Policy Generator tool."
          },
          {
            "@type": "Offer",
            "name": "Growth Plan",
            "price": "5000",
            "priceCurrency": "NGN",
            "description": "₦5,000/month. 50 total listings, 10 images per listing, analytics & click tracking, WhatsApp cart & multi-item orders, AI descriptions (20/day), product/service visibility toggle, manual orders tab, delivery pickup address, marketing tab, stock management, categories."
          },
          {
            "@type": "Offer",
            "name": "Pro Plan",
            "price": "12000",
            "priceCurrency": "NGN",
            "description": "₦12,000/month. Unlimited listings, 50 images per listing, 20 premium store themes, in-app Paystack checkout, automatic order creation, payouts with bank settlement, customer CRM, verified reviews, discounts & promo codes, Sendbox & Topship delivery integration, delivery zones, top-performing analytics, AI descriptions (50/day), product export (PDF/CSV/Excel), custom domain, CAC verification, priority support."
          },
          {
            "@type": "Offer",
            "name": "Premium Plan",
            "price": "25000",
            "priceCurrency": "NGN",
            "description": "₦25,000/month. Everything in Pro plus white-label customer experience, brand-only presentation, highest tier experience, premium positioning. The flagship plan for established operators."
          }
        ]
      },
      "featureList": [
        "Online store for products, with categories, search, zoom and stock badges",
        "Services and bookings, with a bookings calendar",
        "20 premium store themes with colour, font and layout control",
        "Paystack checkout: card, bank transfer and USSD (Pro and Premium)",
        "Orders created automatically when a payment succeeds, payouts settled to the vendor's bank",
        "Sendbox and Topship delivery rates, booking and tracking",
        "Delivery zones and pickup addresses",
        "Branded PDF receipts and a sales ledger for walk-in sales",
        "Customer records with spend, orders and recency",
        "Verified buyer reviews and star ratings",
        "Discount and promo codes with limits and expiry",
        "Loyalty points and abandoned checkout reminders (Premium)",
        "Team accounts with roles",
        "Analytics: store views, clicks and best sellers",
        "Google Search, Google Shopping and Google Maps listings",
        "Google Ads, Meta Pixel and TikTok Pixel (Premium)",
        "Sella, an AI assistant that knows the vendor's business",
        "AI product and service descriptions",
        "Custom domain and CAC verification badge",
        "Push and email notifications for orders, reviews and bookings",
        "Sellapage app for Android",
        "Job listings and a public jobs board",
        "Referral programme",
        "Explore Stores directory of live Sellapage businesses"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Sellapage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sellapage is a business management and growth platform for Nigerian businesses. It gives you an online store for products, services and bookings, takes payments through Paystack, books delivery, keeps your customer records, receipts and sales ledger, and helps you get found on Google, all from one dashboard and the Android app."
          }
        },
        {
          "@type": "Question",
          "name": "Do my customers need to download anything?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your store is a regular web page. Customers tap your link, browse, and pay, with no app and no account."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use it for my walk-in sales too?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Record walk-in and offline sales, send a receipt, and see them next to your online orders, so your sales and records are in one place."
          }
        },
        {
          "@type": "Question",
          "name": "What if I'm not good with technology?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sellapage is built for everyday business owners, not technical teams. If you can upload a photo and fill a simple form, you can run your business here, and Sella, the assistant inside your dashboard, can help."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get paid?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Customers pay by card, bank transfer or USSD through Paystack, and the money settles to your bank account. Sellapage takes no cut of your sales."
          }
        },
        {
          "@type": "Question",
          "name": "Is it really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, the Starter plan is free for good. Paid plans add more as you grow: Growth at ₦5,000 a month, Pro at ₦12,000 a month and Premium at ₦25,000 a month."
          }
        }
      ]
    }
    </script>
